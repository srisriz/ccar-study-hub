<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-P Question Bank</title>
<script src="/auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an exam-hall console. Single column, question first, quiet chrome, domain colour only where it carries meaning. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#18212f; --muted:#5b6678; --line:#d9dee6;
  --accent:#1d5a73; --accent-soft:#e3eef3;
  --good:#1e7b4a; --good-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#9a6400; --warn-soft:#fbf1dc;
  --display:"Source Serif 4", Georgia, serif; --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3644;
  --accent:#6fb3cf; --accent-soft:#1c3340;
  --good:#5cc48b; --good-soft:#163525; --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e3b158; --warn-soft:#3a2d14; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2c3644;
  --accent:#6fb3cf; --accent-soft:#1c3340;
  --good:#5cc48b; --good-soft:#163525; --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e3b158; --warn-soft:#3a2d14; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 96px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:10px;font-weight:500;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:44px}
.tile:hover{border-color:var(--accent)}
.tile .t{font-weight:600}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.weights{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
/* exam */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar .row{justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.qtext{font-size:1.05rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:44px}
.opt input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.opt .k{font-weight:600;color:var(--muted);flex:none;width:1.2em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.nav .in .btn{flex:1}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.qgrid button{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums;font-size:.85rem;position:relative}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--ink)}
.qgrid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qgrid button.r{background:var(--good-soft);border-color:var(--good)} .qgrid button.w{background:var(--bad-soft);border-color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:420px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
/* results */
.score{font-family:var(--display);font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.dom{display:grid;grid-template-columns:1fr 64px;gap:4px 10px;align-items:center;font-size:.9rem}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;margin-bottom:8px}
.meter i{display:block;height:100%}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:72%}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.flagbtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr)}
@media (max-width:560px){.tabs{grid-template-columns:repeat(3,1fr)}}
.mist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0}
.mist summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mist summary::-webkit-details-marker{display:none}
.mist[open] summary{border-bottom:1px solid var(--line)}
.mist .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mist .q{font-weight:500}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs button{padding:10px 2px;font-size:.88rem;min-width:0}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.trap{border-left:4px solid var(--warn)}
.tile:disabled{opacity:.55;cursor:default}
.flash{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:240px;justify-content:center}
.flash .front{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.35}
.flash.on{border-color:var(--accent)}
.flash .back{font-size:1.05rem;font-weight:600;color:var(--accent);border-top:1px solid var(--line);padding-top:12px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.done{opacity:.6}
.day input{width:20px;height:20px;accent-color:var(--accent)}
.cklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ck{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer;min-height:24px}
.ck input{flex:none;margin-top:2px;width:20px;height:20px;accent-color:var(--accent)}
.ck.on label span{color:var(--muted);text-decoration:line-through}
.ck.on label span .pill{text-decoration:none}
.ck.must{background:var(--accent-soft);border-radius:10px;padding:10px;border-top:0;margin:4px 0}
.ck .btn.small{flex:none}
.day.opt{border-style:dashed}
[data-hide][aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.meter i{display:block;height:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>if(!CCXAuth.signedIn())CCXAuth.toLogin()</script>
<main class="wrap" id="app"><p class="muted">Loading the question bank…</p></main>
<dialog id="dlg"><div class="stack"><h3 id="dlgT"></h3><p id="dlgB" class="muted"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="dlgNo">Keep going</button><button class="btn primary" id="dlgYes">Submit</button></div></div></dialog>
<script>
const DOM={SD:["Solution Design & Architecture",17],MP:["Claude Models, Prompting & Context Engineering",13],IN:["Integration",19],EV:["Evaluation, Testing & Optimization",16],GV:["Governance, Safety & Risk Management",14],SC:["Stakeholder Communication & Lifecycle Management",14],DP:["Developer Productivity & Operational Enablement",7]};
const KEYS=Object.keys(DOM), PASS=0.72, $=s=>document.querySelector(s), app=$("#app");
let BANK=[], S=null, timerId=null, homeTab="plan";
const SAVE="ccarp-paused", STATS="ccarp-stats";
let mistFilter="open";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function prep(q,seed){const idx=shuffle(q.o.map((_,i)=>i),seed);return{...q,seed,opts:idx.map(i=>q.o[i]),ans:idx.map((i,p)=>i<q.k?p:-1).filter(p=>p>=0)}}

let STUDY=null;
async function loadData(){const parts=await Promise.all(Array.from({length:8},(_,i)=>fetch("d."+i).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})));let b=new Uint8Array(parts.reduce((a,x)=>a+x.byteLength,0));let o=0;for(const x of parts){b.set(new Uint8Array(x),o);o+=x.byteLength}b=await CCXAuth.open(b);let t;
if(b[0]===0x1f&&b[1]===0x8b){t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}else t=new TextDecoder().decode(b);return JSON.parse(t)}
loadData().then(async({bank:b,study:s})=>{BANK=b;STUDY=s;try{const r=await fetch("c.json",{cache:"no-cache"});if(r.ok){const c=await r.json();if(Array.isArray(c)&&c.length)STUDY.cards=c}}catch(e){}BANK.forEach((t,i)=>t.forEach((q,j)=>q.src=i+"-"+j));const h=location.hash.slice(1);if(["mocks","drills","study","cards","plan","progress"].includes(h))homeTab=h;home()}).catch(e=>{if(e==="auth"){CCXAuth.toLogin();return}app.innerHTML='<div class="card"><h2>The question bank did not load</h2><p class="muted">Reload the page. If it still fails, ask Claude to republish the bank.</p></div>'});

function home(){
  clearInterval(timerId);S=null;window.scrollTo(0,0);
  const best=store("ccarp-best")||{};
  const mocks=BANK.map((t,i)=>{const b=best["m"+i];return `<button class="tile" data-mock="${i}"><span class="t">Mock exam ${i+1}</span><span class="small muted">63 questions · 120 minutes${i===12?" · third-party paper":i===13?" · feature facts":i>=6?" · exam-style":""}</span>${b!=null?`<span class="pill ${b>=PASS?"good":"bad"}">Best ${Math.round(b*100)}%</span>`:`<span class="pill">Not taken</span>`}</button>`}).join("");
  const counts={};BANK.flat().forEach(q=>counts[q.d]=(counts[q.d]||0)+1);
  const drills=KEYS.map(k=>{const b=best["d"+k];return `<button class="tile" data-drill="${k}"><span class="t">${esc(DOM[k][0])}</span><span class="small muted">${DOM[k][1]}% of exam · ${counts[k]} questions</span>${b!=null?`<span class="pill ${b>=PASS?"good":"bad"}">Last ${Math.round(b*100)}%</span>`:""}</button>`}).join("");
  app.innerHTML=`<div class="stack" style="gap:20px">
  <header class="stack" style="gap:6px"><a class="small" href="/" style="color:var(--accent)">← All study kits</a><span class="pill" style="align-self:flex-start">CCAR-P · Claude Certified Architect – Professional</span><h1>Study kit and question bank</h1>
  <p class="muted">A day-by-day checklist to 30 November, notes for every domain and every mock, flashcards, and 819 original questions written to the seven official domains, plus one third-party practice paper (Mock 13). Mock 14 tests feature facts. Mocks 7–12 follow the official practice exam’s format. Unofficial practice material, not Anthropic exam content.</p></header>
  ${pausedCard()}
  <div class="tabs" role="tablist">${[["plan","Plan"],["study","Notes"],["cards","Flashcards"],["mocks","Mocks"],["drills","Drills"],["progress","Progress"]].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${homeTab==k}">${l}</button>`).join("")}</div>
  ${homeTab=="mocks"?`<p class="small muted">Timed like the real exam. Each answer locks as soon as you give it, and the correct answer and explanation appear straight away. The pass line shown is about 72%, a rough guide to the 720/1000 scaled pass mark. Need a break? Press Pause: the clock stops, and your progress is saved on this device until you come back.</p><div class="grid2">${mocks}<button class="tile" data-mix="1"><span class="t">Mixed mock</span><span class="small muted">63 questions · 120 minutes · new mix each time, missed questions first</span>${best.mix!=null?`<span class="pill ${best.mix>=PASS?"good":"bad"}">Last ${Math.round(best.mix*100)}%</span>`:`<span class="pill">Use after Mock 12</span>`}</button></div>`
  :homeTab=="drills"?`<p class="small muted">Untimed. 15 random questions from one domain. Each answer locks when you give it and shows the correct answer and explanation.</p><div class="grid2">${drills}</div>`
  :homeTab=="study"?studyHome():homeTab=="cards"?cardsHome():homeTab=="progress"?progressHome():planHome()}
  ${homeTab=="mocks"||homeTab=="drills"?`<section class="card stack"><h3>Exam blueprint</h3><div class="weights">${KEYS.map(k=>`<span>${esc(DOM[k][0])}</span><span class="num">${DOM[k][1]}%</span>`).join("")}</div><p class="small muted">Source: CCAR-P Exam Guide v1.0 (July 2026). 63 questions, 120 minutes, pass at 720 on a 100–1,000 scale.</p></section>`:""}
  </div>`;
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{homeTab=b.dataset.tab;try{history.replaceState(null,"","#"+homeTab)}catch(e){}home()});
  wireExtras();
  app.querySelectorAll("[data-mock]").forEach(b=>b.onclick=()=>startMock(+b.dataset.mock));
  app.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>startDrill(b.dataset.drill));
  wirePaused();wireProgress();
}

function startMock(i){
  if(!fresh(()=>startMock(i)))return;
  const qs=shuffle(BANK[i],1000+i).map((q,j)=>prep(q,i*997+j*31+7));
  S={mode:"mock",id:"m"+i,title:`Mock exam ${i+1}`,qs,cur:0,sel:qs.map(()=>[]),flag:qs.map(()=>false),lock:qs.map(()=>false),end:Date.now()+120*60000,done:false};
  timerId=setInterval(tick,1000);render();
}
function startMixed(){
  if(!fresh(startMixed))return;
  const seed=Date.now()%100000,miss=new Set(store("ccarp-miss")||[]),all=BANK.flat(),tgt={SD:11,MP:8,IN:12,EV:10,GV:9,SC:9,DP:4};
  let pick=[];KEYS.forEach(k=>{const pool=shuffle(all.filter(q=>q.d===k),seed+k.charCodeAt(0));pool.sort((a,b)=>miss.has(b.src)-miss.has(a.src));pick=pick.concat(pool.slice(0,tgt[k]))});
  const qs=shuffle(pick,seed).map((q,j)=>prep(q,seed+j*17));
  S={mode:"mock",id:"mix",title:"Mixed mock",qs,cur:0,sel:qs.map(()=>[]),flag:qs.map(()=>false),lock:qs.map(()=>false),end:Date.now()+120*60000,done:false};
  timerId=setInterval(tick,1000);render();
}
function startDrill(k){
  if(!fresh(()=>startDrill(k)))return;
  const pool=BANK.flat().filter(q=>q.d===k),seed=Date.now()%100000;
  const qs=shuffle(pool,seed).slice(0,15).map((q,j)=>prep(q,seed+j*13));
  S={mode:"drill",id:"d"+k,title:DOM[k][0],qs,cur:0,sel:qs.map(()=>[]),checked:qs.map(()=>false),flag:qs.map(()=>false),lock:qs.map(()=>false),done:false};
  render();
}
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function tick(){if(!S||S.mode!=="mock"||S.done||S.paused)return;const left=S.end-Date.now();const el=$("#timer");if(el){el.textContent=fmt(left);el.classList.toggle("low",left<600000)}if(left<=0)finish()}
const correct=(q,sel)=>sel.length===q.ans.length&&q.ans.every(a=>sel.includes(a));

function render(){
  const q=S.qs[S.cur],sel=S.sel[S.cur],n=S.qs.length,answered=S.sel.filter(s=>s.length).length;
  const reveal=S.done||S.lock[S.cur];
  const multi=q.k>1, kWord=["","one","two","three","four"][q.k]||q.k;
  const opts=q.opts.map((o,i)=>{let c=sel.includes(i)?"sel":"";if(reveal){if(q.ans.includes(i))c="right";else if(sel.includes(i))c="wrong"}
    return `<label class="opt ${c}" for="o${i}"><input id="o${i}" type="${multi?"checkbox":"radio"}" name="opt" ${sel.includes(i)?"checked":""} ${reveal?"disabled":""} data-i="${i}"><span class="k">${"ABCDEF"[i]}</span><span>${esc(o)}</span></label>`}).join("");
  const status=reveal?(correct(q,sel)?`<span class="pill good">Correct</span>`:sel.length?`<span class="pill bad">Incorrect · answer ${q.ans.map(i=>"ABCDEF"[i]).join(", ")}</span>`:`<span class="pill warn">Not answered · answer ${q.ans.map(i=>"ABCDEF"[i]).join(", ")}</span>`):"";
  app.innerHTML=`<div class="bar"><div class="row"><button class="btn ghost small" id="quit">${S.done?"← Results":"Exit"}</button><strong class="small">${esc(S.title)}</strong>${S.mode==="mock"&&!S.done?`<span class="row" style="gap:10px"><span class="timer" id="timer">${fmt(S.end-Date.now())}</span><button class="btn small" id="pause">Pause</button></span>`:!S.done?`<span class="row" style="gap:10px"><span class="small muted">${S.cur+1}/${n}</span><button class="btn small" id="pause">Pause</button></span>`:`<span class="small muted">${S.cur+1}/${n}</span>`}</div><div class="prog"><i style="width:${(S.done?S.cur+1:answered)/n*100}%"></i></div></div>
  <div class="stack" style="gap:16px">
   <div class="row" style="justify-content:space-between"><span class="small muted">Question ${S.cur+1} of ${n} · ${esc(DOM[q.d][0])}</span><span class="row" style="gap:6px">${reveal?"":missedPill(q.src)}${status}</span></div>
   <p class="qtext">${esc(q.q)}</p>
   ${multi?`<p class="small muted">Choose ${kWord} answers.${reveal?"":` Your answer locks once you have picked ${kWord}.`}</p>`:""}
   <div class="opts">${opts}</div>
   ${reveal?`<div class="why"><strong>Why: </strong>${esc(q.x)}</div>`:""}
   <div class="row">${!S.done?`<button class="btn flagbtn" id="flag" aria-pressed="${S.flag[S.cur]}">${S.flag[S.cur]?"Flagged for review":"Flag for review"}</button>`:""}
   </div>
   ${S.mode==="mock"?`<details class="card"><summary class="small" style="cursor:pointer;min-height:24px">All questions · ${answered} answered${S.done?"":` · ${S.flag.filter(Boolean).length} flagged`}</summary><div class="qgrid" style="margin-top:12px">${S.qs.map((qq,i)=>{let c=i===S.cur?"cur ":"";if(S.done||S.lock[i])c+=correct(qq,S.sel[i])?"r ":"w ";if(!S.done){if(S.flag[i])c+="flag"}return `<button class="${c}" data-go="${i}" aria-label="Question ${i+1}">${i+1}</button>`}).join("")}</div></details>`:""}
  </div>

function stats(){let st=store(STATS);if(!st){st={};(store("ccarp-miss")||[]).forEach(k=>st[k]={r:0,w:1,last:0,t:0});store(STATS,st)}return st}
function record(src,ok){const st=stats(),e=st[src]||{r:0,w:0};if(ok)e.r++;else e.w++;e.last=ok?1:0;e.t=Date.now();st[src]=e;store(STATS,st)}
function missedPill(src){if(S&&S.done)return "";const e=stats()[src];return e&&e.w?`<span class="pill warn" title="Times you have got this question wrong before">Missed ${e.w}×</span>`:""}
function qBySrc(src){const [i,j]=String(src).split("-").map(Number);return BANK[i]&&BANK[i][j]?{q:BANK[i][j],i,j}:null}
function band(p,n){if(n<5)return["","Too few answers"];return p>=.85?["good","Strong"]:p>=PASS?["good","Pass level"]:p>=.6?["warn","Needs work"]:["bad","Weak"]}
function progressHome(){const st=stats(),dom={};let R=0,W=0;
  Object.entries(st).forEach(([k,e])=>{const x=qBySrc(k);if(!x)return;const d=x.q.d;dom[d]=dom[d]||[0,0];dom[d][0]+=e.r;dom[d][1]+=e.w;R+=e.r;W+=e.w});
  const rows=KEYS.map(k=>{const [r,w]=dom[k]||[0,0],n=r+w,p=n?r/n:0;return{k,r,w,n,p}}).sort((a,b)=>(a.n?a.p:2)-(b.n?b.p:2));
  const strength=rows.map(x=>{const [c,l]=band(x.p,x.n);return `<span>${esc(DOM[x.k][0])} <span class="small muted">· ${DOM[x.k][1]}% of exam</span></span><span class="num">${x.n?Math.round(x.p*100)+"%":"–"}</span><div class="meter"><i style="width:${x.p*100}%;background:var(${x.p>=PASS?"--good":x.p>=.6?"--warn":"--bad"})"></i><b></b></div><span class="small muted" style="grid-column:1/-1;margin:-6px 0 8px">${x.n?`${x.r} right · ${x.w} wrong`:"Not answered yet"}${l&&x.n?` · <span class="pill ${c}">${l}</span>`:""}</span>`}).join("");
  const all=Object.entries(st).filter(([k,e])=>e.w>0&&qBySrc(k)).map(([k,e])=>({k,e,...qBySrc(k)}));
  const open=all.filter(x=>!x.e.last),list=(mistFilter==="open"?open:all).sort((a,b)=>b.e.w-a.e.w||b.e.t-a.e.t);
  const items=list.map(({k,e,q,i,j})=>`<details class="mist"><summary><span class="row" style="justify-content:space-between"><span class="small muted">${esc(DOM[q.d][0])} · Mock ${i+1}</span><span class="row" style="gap:6px"><span class="pill bad">Missed ${e.w}×</span>${e.r?`<span class="pill good">Right ${e.r}×</span>`:""}${e.last?`<span class="pill good">Fixed</span>`:""}</span></span><span class="q">${esc(q.q)}</span></summary>
    <div class="body"><p><strong>Answer: </strong>${q.o.slice(0,q.k).map(esc).join(" <em>and</em> ")}</p><p class="small">${esc(q.x)}</p></div></details>`).join("");
  return `<section class="card stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><h3>Strength index</h3>${R+W?`<span class="pill ${R/(R+W)>=PASS?"good":"bad"}">Overall ${Math.round(R/(R+W)*100)}% · ${R+W} answers</span>`:""}</div>
  <p class="small muted">Every answer you give in mocks and drills counts. Weakest areas are at the top. The black tick marks the ~72% pass line.</p>
  ${R+W?`<div class="dom">${strength}</div>`:`<p class="muted">Answer some questions in a mock or drill and your strengths will show here.</p>`}</section>

  <p class="small muted">Most-missed first. Tap a question to see the answer. A question moves to “Fixed” once you get it right on a later attempt.</p>

  ${open.length?`<div class="row"><button class="btn primary" data-cards="miss">Flashcards for my missed questions</button></div>`:""}
  ${Object.keys(st).length?`<div class="row"><button class="btn ghost small" id="resetStats">Reset progress</button></div>`:""}</section>`}

  const hidden=hide?CHECK.flatMap(x=>x[3]).filter(it=>done[it[0]]).length:0;
  const act=a=>{if(!a)return"";const [k,v]=a.split(":");const lab={notes:"Notes",cards:"Cards",paper:"Notes",mock:"Start"}[k];
    const attr={notes:`data-notes="${v}"`,cards:`data-cards="${v}"`,paper:`data-paper="${v}"`,mock:`data-mock="${v}"`}[k];
    return `<button class="btn small ${k==="mock"?"primary":"ghost"}" ${attr}>${lab}</button>`};
  const row=(it,opt)=>{const [id,text,a]=it,isM=a.startsWith("mock:"),sc=isM?best["m"+a.slice(5)]:null;
    return `<li class="ck ${done[id]?"on":""} ${isM&&!opt?"must":""}"><label><input type="checkbox" data-check="${id}" ${done[id]?"checked":""}><span>${isM&&!opt?`<strong>Mandatory:</strong> `:""}${esc(text)}${sc!=null?` <span class="pill ${sc>=PASS?"good":"bad"}">Best ${Math.round(sc*100)}%</span>`:""}</span></label>${act(a)}</li>`};
  return `<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Exam: Monday 30 November</h3><span class="pill">${n}/${all.length} done</span></div>
  <div class="meter" aria-hidden="true"><i style="width:${all.length?n/all.length*100:0}%;background:var(--accent)"></i></div>
  <p class="small muted">Three days to go. One timed mock a day (${mdone}/${mocks.length} done), with the highest-weighted domains first: Integration, Solution Design and Evaluation on Saturday, then Governance, Stakeholders and Prompting on Sunday. If you have already covered a topic, give the notes a 2-minute skim and tick it. Extras at the bottom are only for spare time. Ticks are saved on this device.</p>
  <div class="row" style="justify-content:space-between"><button class="btn small" data-hide="1" aria-pressed="${hide}">${hide?"Show completed items":"Hide completed items"}</button>${hidden?`<span class="small muted">${hidden} completed item${hidden===1?"":"s"} hidden</span>`:""}</div></section>
  <div class="stack">${CHECK.map(([iso,day,title,items,opt])=>{const k=items.filter(it=>done[it[0]]).length,shown=hide?items.filter(it=>!done[it[0]]):items;
    if(hide&&!shown.length)return "";
    return `<section class="card stack day ${iso&&iso===today?"today":""} ${k===items.length?"done":""} ${opt?"opt":""}"><div class="row" style="justify-content:space-between"><span class="small muted">${day}${iso&&iso===today?` · <strong>Today</strong>`:""}</span><span class="pill">${k}/${items.length}</span></div><h3>${esc(title)}</h3><ul class="cklist">${shown.map(it=>row(it,opt)).join("")}</ul></section>`}).join("")}${hide&&!CHECK.some(x=>x[3].some(it=>!done[it[0]]))?`<section class="card"><p class="muted">Everything is ticked off. Good luck on Monday.</p></section>`:""}</div>
  <section class="card stack"><h3>How to use each day</h3><ul class="list"><li><strong>Mock first when you can:</strong> timed, phone away, no notes. Aim for 80% or more; the pass line is about 72%.</li><li><strong>Then the misses:</strong> for every miss and guess, say why each wrong option fails the requirement.</li><li><strong>Topics:</strong> tap Notes to open the domain, skim, tick. Use the traps list and flashcards to finish each domain.</li><li><strong>Rule of thumb:</strong> most lost marks come from choosing a measure that only supports the goal. Ask “what directly enforces or solves this?”</li></ul></section>`}

function wireExtras(){
  app.querySelectorAll("[data-features]").forEach(b=>b.onclick=openFeatures);
  app.querySelectorAll("[data-notes]").forEach(b=>b.onclick=()=>openNotes(b.dataset.notes));
  app.querySelectorAll("[data-paper]").forEach(b=>b.onclick=()=>openPaper(+b.dataset.paper));
  app.querySelectorAll("[data-cards]").forEach(b=>b.onclick=()=>startCards(b.dataset.cards));
  app.querySelectorAll("[data-mix]").forEach(b=>b.onclick=startMixed);
  app.querySelectorAll("[data-drillgo]").forEach(b=>b.onclick=()=>startDrill(b.dataset.drillgo));
  app.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{store("ccarp-hide",!store("ccarp-hide"));home()});
  app.querySelectorAll("[data-check]").forEach(b=>b.onchange=()=>{const d=store("ccarp-check")||{};d[b.dataset.check]=b.checked;store("ccarp-check",d);const y=window.scrollY;home();window.scrollTo(0,y)});
}

function results(){
  window.scrollTo(0,0);const n=S.qs.length,ok=S.qs.filter((q,i)=>correct(q,S.sel[i])).length,pct=ok/n;
  const by={};S.qs.forEach((q,i)=>{by[q.d]=by[q.d]||[0,0];by[q.d][1]++;if(correct(q,S.sel[i]))by[q.d][0]++});
  const doms=KEYS.filter(k=>by[k]).map(k=>{const [a,t]=by[k],p=a/t;return `<span>${esc(DOM[k][0])}</span><span class="num">${a}/${t}</span><div class="meter"><i style="width:${p*100}%;background:var(${p>=PASS?"--good":"--bad"})"></i>${S.mode==="mock"?"<b></b>":""}</div>`}).join("");
  const weak=KEYS.filter(k=>by[k]&&by[k][0]/by[k][1]<PASS).sort((a,b)=>by[a][0]/by[a][1]-by[b][0]/by[b][1]);
  const list=S.qs.map((q,i)=>({q,i,ok:correct(q,S.sel[i])})).filter(x=>!x.ok);
  app.innerHTML=`<div class="stack" style="gap:20px">
  <div class="row" style="justify-content:space-between"><button class="btn ghost" id="home">← All tests</button><span class="small muted">${esc(S.title)}</span></div>
  <section class="card stack"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="score">${Math.round(pct*100)}%</div><p class="muted">${ok} of ${n} correct</p></div>
  ${S.mode==="mock"?`<span class="pill ${pct>=PASS?"good":"bad"}">${pct>=PASS?"Above the ~72% pass line":"Below the ~72% pass line"}</span>`:""}</div>
  ${weak.length?`<p class="small"><strong>Revise next:</strong> ${weak.map(k=>esc(DOM[k][0])).join(", ")}.</p>`:`<p class="small"><strong>Every domain is at or above the pass line.</strong></p>`}</section>
  <section class="card stack"><h3>By domain</h3><div class="dom">${doms}</div>${S.mode==="mock"?`<p class="small muted">The black tick marks 72%.</p>`:""}</section>
  <section class="stack"><h3>Questions you missed (${list.length})</h3>${list.length?list.map(x=>`<button class="tile" data-rev="${x.i}"><span class="small muted">Q${x.i+1} · ${esc(DOM[x.q.d][0])}</span><span>${esc(x.q.q)}</span></button>`).join(""):`<p class="muted">None. Well done.</p>`}</section>
  <div class="row"><button class="btn" id="revall">Review all answers</button>${S.mode==="drill"?`<button class="btn primary" id="again">New drill in this domain</button>`:""}</div>
  </div>`;
  $("#home").onclick=home;$("#revall").onclick=()=>go(0);
  const ag=$("#again");if(ag)ag.onclick=()=>startDrill(S.id.slice(1));
  app.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>go(+b.dataset.rev));
}
</script>
</body>
</html>
